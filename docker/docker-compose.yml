# docker/docker-compose.yml
# Agent runner (one-shot) + optional Telegram bot + optional local Ollama.
#
# Safety notes:
#  - No Docker socket is mounted; containers run as a non-root user.
#  - Config is mounted read-only. Create config/settings.yaml first (see README).
#  - Memory uses Mem0 cloud (MEM0_API_KEY) or the built-in in-memory fallback.
#    There is no official self-hosted Mem0 MCP image, so none is bundled.
#
# Usage:
#   docker compose -f docker/docker-compose.yml run --rm agent-runner
#   docker compose -f docker/docker-compose.yml --profile telegram up -d telegram-bot

networks:
  agents:
    driver: bridge

volumes:
  workspace:
  ollama_models:

# ─── Shared environment ───────────────────────────────────────────────────────
x-common-env: &common-env
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY}
  XAI_API_KEY: ${XAI_API_KEY:-}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITLAB_TOKEN: ${GITLAB_TOKEN:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  MEM0_API_KEY: ${MEM0_API_KEY:-}

services:

  # ── Main agent runner (one-shot: runs once and exits) ───────────────────
  agent-runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: poietes-agent-runner
    environment:
      <<: *common-env
    volumes:
      - workspace:/workspace
      - ../config:/app/config:ro
    networks:
      - agents
    restart: "no"          # one-shot: never restart (each run spends LLM tokens)
    command: ["python", "main.py", "run", "--task", "scan all projects"]

  # ── Telegram bot (optional) ─────────────────────────────────────────────
  telegram-bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: poietes-telegram-bot
    environment:
      <<: *common-env
    volumes:
      - workspace:/workspace
      - ../config:/app/config:ro
    networks:
      - agents
    restart: unless-stopped
    command: ["python", "main.py", "bot"]
    profiles:
      - telegram   # enable with: docker compose --profile telegram up

  # ── Ollama (local LLMs) ─────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:0.40.14
    container_name: poietes-ollama
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - agents
    ports:
      - "127.0.0.1:11434:11434"   # localhost only
    restart: unless-stopped
    profiles:
      - ollama
    # Uncomment for GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
